<div class="auth-page">
  <!-- Left Panel -->
  <div class="auth-left">
    <div class="auth-brand">
      <div class="brand-logo">🛋️</div>
      <h1>CustomCraft<br>Furniture</h1>
      <p>India's Premier Customized Furniture Destination</p>
    </div>
    <div class="auth-features">
      <div class="auth-feature"><i class="fas fa-check-circle"></i> 10,000+ Happy Customers</div>
      <div class="auth-feature"><i class="fas fa-check-circle"></i> Premium Wood Craftsmanship</div>
      <div class="auth-feature"><i class="fas fa-check-circle"></i> 500+ Custom Design Options</div>
      <div class="auth-feature"><i class="fas fa-check-circle"></i> 5-Year Warranty Guarantee</div>
    </div>
    <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=60" alt="Furniture" class="auth-img">
  </div>

  <!-- Right Panel -->
  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back!</h2>
        <p>Sign in to your CustomCraft account</p>
      </div>

      <!-- Demo Buttons -->
      <div class="demo-btns">
        <button class="demo-btn" (click)="demoLogin('user')">
          <i class="fas fa-user"></i> Demo User Login
        </button>
        <button class="demo-btn demo-admin" (click)="demoLogin('admin')">
          <i class="fas fa-crown"></i> Demo Admin Login
        </button>
      </div>

      <div class="divider-or">
        <span>or continue with email</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-control" placeholder="your@email.com"
              [value]="email()" (input)="email.set($any($event.target).value)"
              autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Password
            <a href="#" class="forgot-link">Forgot password?</a>
          </label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input [type]="showPassword() ? 'text' : 'password'" class="form-control" placeholder="Enter password"
              [value]="password()" (input)="password.set($any($event.target).value)"
              autocomplete="current-password" required>
            <button type="button" class="toggle-pass" (click)="showPassword.set(!showPassword())">
              <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="loading()">
          @if (loading()) {
            <i class="fas fa-spinner fa-spin"></i> Signing in...
          } @else {
            <i class="fas fa-sign-in-alt"></i> Sign In
          }
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a routerLink="/auth/register">Create Account</a>
      </p>
    </div>
  </div>
</div>
